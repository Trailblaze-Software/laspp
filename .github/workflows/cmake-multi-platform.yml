name: Build and Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC Release
            os: ubuntu-24.04
            cxx: g++-14
            build-type: Release
          - name: Ubuntu GCC Debug
            os: ubuntu-24.04
            cxx: g++-14
            build-type: Debug
          - name: Ubuntu Clang Release
            os: ubuntu-24.04
            cxx: clang++-18
            build-type: Release
          - name: Ubuntu Clang Debug
            os: ubuntu-24.04
            cxx: clang++-18
            build-type: Debug
          - name: macOS Release
            os: macos-14
            cxx: clang++
            build-type: Release
          - name: macOS Debug
            os: macos-14
            cxx: clang++
            build-type: Debug
          - name: Windows MSVC Release
            os: windows-latest
            cxx: cl
            build-type: Release
          - name: Windows MSVC Debug
            os: windows-latest
            cxx: cl
            build-type: Debug
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14
        if: matrix.cxx == 'g++-14'
        run: sudo apt-get update && sudo apt-get install -y g++-14
      - name: Install Clang 18
        if: matrix.cxx == 'clang++-18'
        run: sudo apt-get update && sudo apt-get install -y clang-18
      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DLASPP_BUILD_TESTS=ON -DLASPP_BUILD_BENCHMARK=OFF -DLASPP_AGGRESSIVE_OPTIMIZATIONS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config ${{ matrix.build-type }}
